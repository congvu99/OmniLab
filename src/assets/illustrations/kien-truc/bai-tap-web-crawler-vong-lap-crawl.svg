<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-bwc-vonglap-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-bwc-vonglap-title">Vòng lặp crawl: kiểm tra chữ ký tương tự trước khi crawl, nếu trùng thì giảm độ ưu tiên để tránh chu trình</title>
  <defs>
    <marker id="svg-bwc-vonglap-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
    <marker id="svg-bwc-vonglap-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect x="100" y="6" width="220" height="30" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="210" y="26" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Lấy URL ưu tiên cao nhất</text>

  <path d="M210 36 V56" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-bwc-vonglap-arrow-ink2)" />

  <rect x="100" y="56" width="220" height="30" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="210" y="76" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Đã crawl trang tương tự?</text>

  <path d="M255 86 V108" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-bwc-vonglap-arrow-ink2)" />
  <text x="292" y="102" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">không</text>

  <rect x="160" y="108" width="190" height="30" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="255" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Crawl trang, tạo chữ ký</text>

  <path d="M255 138 V160" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-bwc-vonglap-arrow-ink2)" />

  <rect x="140" y="160" width="210" height="32" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="245" y="181" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Job chỉ mục + lưu crawled_links</text>

  <path d="M140 86 C 140 98, 70 96, 70 108" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-bwc-vonglap-arrow-accent)" />
  <text x="150" y="102" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--accent)">có</text>

  <rect x="10" y="108" width="120" height="30" rx="10" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2" />
  <text x="70" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Giảm ưu tiên</text>

  <path d="M30 108 V31 Q30 21 40 21 H100" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#svg-bwc-vonglap-arrow-accent)" />
</svg>
