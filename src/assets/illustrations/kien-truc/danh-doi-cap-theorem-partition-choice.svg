<svg viewBox="0 0 360 260" width="100%" role="img" aria-labelledby="svg-cap-partition-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-cap-partition-title">Khi mạng bị phân mảnh, hệ thống phải chọn CP hoặc AP</title>
  <defs>
    <marker id="svg-cap-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect x="40" y="20" width="80" height="36" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="80" y="43" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Node A</text>
  <rect x="240" y="20" width="80" height="36" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="280" y="43" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Node B</text>

  <path d="M120 38 H165" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M195 38 H240" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M165 30 L175 46 L185 30 L195 46" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="180" y="78" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">mạng bị phân mảnh (partition)</text>

  <path d="M180 90 C 180 120, 105 120, 105 160" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-cap-arrow-accent)" />
  <path d="M180 90 C 180 120, 255 120, 255 160" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-cap-arrow-accent)" />

  <rect x="40" y="160" width="130" height="64" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="105" y="186" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">CP</text>
  <text x="105" y="204" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">từ chối / chờ,</text>
  <text x="105" y="218" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">giữ dữ liệu đúng</text>

  <rect x="190" y="160" width="130" height="64" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="255" y="186" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">AP</text>
  <text x="255" y="204" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">vẫn trả lời,</text>
  <text x="255" y="218" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">dữ liệu có thể cũ</text>
</svg>
