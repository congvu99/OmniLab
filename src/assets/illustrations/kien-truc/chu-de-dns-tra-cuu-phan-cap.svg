<svg viewBox="0 -20 360 300" width="100%" role="img" aria-labelledby="svg-dns-resolve-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-dns-resolve-title">Tra cứu DNS phân cấp: resolver tự hỏi lần lượt từng cấp, và trả ngay nhờ cache</title>
  <defs>
    <marker id="svg-dnsr-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
    <marker id="svg-dnsr-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect x="130" y="10" width="100" height="36" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="180" y="33" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" fill="var(--ink)">Client</text>

  <rect x="130" y="88" width="100" height="44" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="180" y="106" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">
    <tspan x="180" dy="0">Resolver</tspan>
    <tspan x="180" dy="16" font-size="12" fill="var(--ink-2)">(có cache)</tspan>
  </text>

  <rect x="8" y="212" width="100" height="34" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="58" y="233" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Root</text>

  <rect x="128" y="212" width="100" height="34" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="178" y="233" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">TLD (.com)</text>

  <rect x="248" y="212" width="104" height="34" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="300" y="233" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Authoritative</text>

  <path d="M180 46 V88" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-dnsr-arrow-ink2)" />
  <text x="188" y="70" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">tên miền?</text>

  <path d="M150 132 L60 210" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" marker-start="url(#svg-dnsr-arrow-ink2)" marker-end="url(#svg-dnsr-arrow-ink2)" />
  <path d="M180 132 V210" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" marker-start="url(#svg-dnsr-arrow-ink2)" marker-end="url(#svg-dnsr-arrow-ink2)" />
  <path d="M210 132 L298 210" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" marker-start="url(#svg-dnsr-arrow-ink2)" marker-end="url(#svg-dnsr-arrow-ink2)" />

  <circle cx="105" cy="171" r="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="105" y="175" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">1</text>
  <circle cx="180" cy="171" r="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="175" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">2</text>
  <circle cx="254" cy="171" r="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="254" y="175" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">3</text>

  <text x="8" y="146" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">
    <tspan x="8" dy="0">trượt cache:</tspan>
    <tspan x="8" dy="14">resolver tự hỏi</tspan>
    <tspan x="8" dy="14">1 → 2 → 3</tspan>
  </text>

  <path class="svg-dnsr-flow" d="M230 105 C 300 105, 300 20, 230 20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-dnsr-arrow-accent)" />
  <text x="298" y="58" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--accent)">
    <tspan x="298" dy="0">có cache</tspan>
    <tspan x="298" dy="15">→ trả ngay</tspan>
  </text>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .svg-dnsr-flow { stroke-dasharray: 6 6; animation: svg-dnsr-dash 1.6s linear infinite; }
    }
    @keyframes svg-dnsr-dash { to { stroke-dashoffset: -24; } }
  </style>
</svg>
