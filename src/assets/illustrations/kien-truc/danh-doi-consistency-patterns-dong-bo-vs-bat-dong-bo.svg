<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-consistency-patterns-nhan-ban-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-consistency-patterns-nhan-ban-title">Nhân bản đồng bộ (nhất quán mạnh) so với bất đồng bộ (nhất quán cuối cùng)</title>
  <defs>
    <marker id="svg-csa-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
    <marker id="svg-csa-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Nhân bản đồng bộ (mạnh)</text>
  <rect x="8" y="26" width="90" height="36" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="53" y="49" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Master</text>
  <path d="M98 44 H124" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-csa-arrow-accent)" />
  <rect x="124" y="26" width="90" height="36" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="169" y="49" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Replica</text>
  <text x="230" y="49" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">chờ xong mới</text>
  <text x="230" y="62" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">trả lời client</text>

  <line x1="0" y1="88" x2="360" y2="88" stroke="var(--line)" stroke-width="1" />

  <text x="8" y="112" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Nhân bản bất đồng bộ (cuối cùng)</text>
  <rect x="8" y="122" width="90" height="36" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="53" y="145" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Master</text>
  <path d="M98 140 H124" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#svg-csa-arrow-ink2)" />
  <rect x="124" y="122" width="90" height="36" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="169" y="145" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Replica</text>
  <text x="230" y="140" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">trả lời ngay,</text>
  <text x="230" y="153" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">cập nhật sau</text>

  <text x="180" y="190" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Đồng bộ: chậm hơn nhưng luôn khớp.</text>
  <text x="180" y="208" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Bất đồng bộ: nhanh, có thể đọc phải bản cũ.</text>
</svg>
