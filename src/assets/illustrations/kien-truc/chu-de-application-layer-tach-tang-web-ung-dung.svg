<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-appl-tiers-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-appl-tiers-title">Tách tầng web và tầng ứng dụng để mở rộng độc lập</title>
  <defs>
    <marker id="svg-applt-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <text x="8" y="18" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Tầng web (cố định)</text>
  <rect x="30" y="28" width="70" height="34" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="145" y="28" width="70" height="34" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="260" y="28" width="70" height="34" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />

  <path d="M65 62 V90" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-applt-arrow-ink2)" />
  <path d="M180 62 V90" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-applt-arrow-ink2)" />
  <path d="M295 62 V90" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-applt-arrow-ink2)" />

  <text x="8" y="112" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Tầng ứng dụng (co giãn)</text>
  <rect x="8" y="122" width="70" height="34" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="90" y="122" width="70" height="34" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="172" y="122" width="70" height="34" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="254" y="122" width="90" height="34" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4" />
  <text x="299" y="144" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="20" fill="var(--accent)">+</text>

  <path d="M299 156 V182" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-applt-arrow-ink2)" />
  <text x="299" y="200" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">
    <tspan x="299" dy="0">thêm máy mới, không</tspan>
    <tspan x="299" dy="13">đụng tới tầng web</tspan>
  </text>
</svg>
