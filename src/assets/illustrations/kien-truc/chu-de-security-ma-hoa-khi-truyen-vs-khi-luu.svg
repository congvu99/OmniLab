<svg viewBox="0 0 360 260" width="100%" role="img" aria-labelledby="svg-sec-mh-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-sec-mh-title">Mã hóa khi truyền và mã hóa khi lưu bảo vệ hai điểm khác nhau</title>
  <defs>
    <marker id="svg-sec-mh-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Khi truyền (in transit)</text>

  <rect x="8" y="30" width="70" height="34" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="43" y="52" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Client</text>

  <rect x="282" y="30" width="70" height="34" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="317" y="52" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Server</text>

  <rect x="130" y="26" width="100" height="42" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <path d="M130 26 L180 54 L230 26" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="180" y="82" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">gói kín trong "phong bì" TLS</text>

  <path d="M78 47 H130" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-sec-mh-arrow)" />
  <path d="M230 47 H282" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-sec-mh-arrow)" />

  <line x1="0" y1="118" x2="360" y2="118" stroke="var(--line)" stroke-width="1" />

  <text x="8" y="144" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Khi lưu (at rest)</text>

  <rect x="140" y="158" width="80" height="66" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="180" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Ổ đĩa</text>
  <rect x="164" y="192" width="32" height="24" rx="4" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <path d="M170 192 V184 a10 10 0 0 1 20 0 V192" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />

  <text x="180" y="246" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">lấy được ổ đĩa vẫn không đọc được nếu thiếu khóa</text>
</svg>
