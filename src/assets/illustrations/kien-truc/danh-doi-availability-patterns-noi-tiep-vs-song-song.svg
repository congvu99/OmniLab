<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-availability-patterns-mac-noi-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-availability-patterns-mac-noi-title">Mắc nối tiếp làm giảm độ sẵn sàng, mắc song song làm tăng độ sẵn sàng</title>
  <defs>
    <marker id="svg-asp-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Nối tiếp: cả hai phải sống</text>
  <path d="M20 44 H48" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-asp-arrow-ink2)" />
  <rect x="48" y="26" width="80" height="36" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="88" y="49" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Foo</text>
  <path d="M128 44 H168" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-asp-arrow-ink2)" />
  <rect x="168" y="26" width="80" height="36" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="208" y="49" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Bar</text>
  <path d="M248 44 H276" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-asp-arrow-ink2)" />
  <text x="180" y="86" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--danger)">99,9% × 99,9% ≈ 99,8%</text>

  <line x1="0" y1="102" x2="360" y2="102" stroke="var(--line)" stroke-width="1" />

  <text x="8" y="124" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Song song: chỉ cần một bên sống</text>
  <path d="M20 170 H60" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <circle cx="60" cy="170" r="4" fill="var(--ink-2)" />
  <path d="M60 170 C 80 170, 80 150, 98 150" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-asp-arrow-ink2)" />
  <path d="M60 170 C 80 170, 80 192, 98 192" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-asp-arrow-ink2)" />
  <rect x="98" y="134" width="80" height="32" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="138" y="155" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Foo</text>
  <rect x="98" y="176" width="80" height="32" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="138" y="197" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Bar</text>
  <path d="M178 150 C 196 150, 196 170, 216 170" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M178 192 C 196 192, 196 170, 216 170" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <circle cx="216" cy="170" r="4" fill="var(--ink-2)" />
  <text x="230" y="175" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--accent)">→ 99,9999%</text>
</svg>
