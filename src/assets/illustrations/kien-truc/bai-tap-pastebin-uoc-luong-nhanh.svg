<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-btp-uocluong-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-btp-uocluong-title">Ước lượng nhanh: từ số paste mỗi tháng ra số lượt ghi mỗi giây</title>
  <defs>
    <marker id="svg-btp-uocluong-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <rect x="40" y="8" width="280" height="32" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="30" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">10 triệu paste / tháng</text>

  <path d="M180 40 V62" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-btp-uocluong-arrow)" />

  <rect x="20" y="62" width="320" height="32" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="180" y="84" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">× 1,27 KB/paste ≈ 12,7 GB/tháng</text>

  <path d="M180 94 V116" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-btp-uocluong-arrow)" />

  <rect x="40" y="116" width="280" height="32" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="138" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">÷ 2,5 triệu giây / tháng</text>

  <path d="M180 148 V170" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-btp-uocluong-arrow)" />

  <rect x="90" y="170" width="180" height="32" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="180" y="192" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">≈ 4 lượt ghi/giây</text>
</svg>
