<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-lb-health-check-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-lb-health-check-title">Load balancer loại máy chủ không khỏe khỏi vòng chia tải</title>
  <defs>
    <marker id="svg-lbhc-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
    <marker id="svg-lbhc-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <rect x="16" y="92" width="80" height="40" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="56" y="117" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" fill="var(--ink)">LB</text>

  <rect x="250" y="18" width="94" height="40" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="297" y="43" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Server 1</text>

  <rect x="250" y="92" width="94" height="40" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 4" />
  <text x="297" y="112" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Server 2</text>
  <text x="297" y="126" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">(tạm nghỉ)</text>

  <rect x="250" y="166" width="94" height="40" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="297" y="191" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Server 3</text>

  <path d="M96 100 C 180 60, 180 38, 250 38" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-lbhc-arrow-accent)" />
  <path d="M96 132 C 180 172, 180 186, 250 186" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-lbhc-arrow-accent)" />
  <text x="180" y="70" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--accent)">request</text>

  <path d="M96 112 H250" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#svg-lbhc-arrow-ink2)" />
  <path d="M165 105 L179 119 M179 105 L165 119" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" />
  <text x="172" y="145" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">health check lỗi → loại tạm thời</text>
</svg>
