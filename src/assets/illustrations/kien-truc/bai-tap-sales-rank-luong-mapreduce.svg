<svg viewBox="0 0 360 300" width="100%" role="img" aria-labelledby="svg-sales-rank-mapreduce-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-sales-rank-mapreduce-title">Luồng MapReduce hai bước: gộp số lượng rồi mới sắp xếp phân tán</title>
  <defs>
    <marker id="svg-srm-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <rect x="40" y="10" width="280" height="32" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="31" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Log giao dịch thô</text>
  <path d="M180 42 V56" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-srm-arrow-ink2)" />

  <rect x="40" y="56" width="240" height="32" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="160" y="77" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Map: lọc tuần qua, phát (danh mục, SP)</text>
  <path d="M160 88 V102" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-srm-arrow-ink2)" />

  <rect x="40" y="102" width="240" height="32" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="160" y="123" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Reduce: cộng dồn số lượng</text>
  <path d="M160 134 V148" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-srm-arrow-ink2)" />

  <rect x="40" y="148" width="240" height="32" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="160" y="169" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Sắp xếp theo (danh mục, SL)</text>
  <path d="M160 180 V194" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-srm-arrow-ink2)" />

  <rect x="40" y="194" width="280" height="40" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="214" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">sales_rank đã xếp hạng</text>
  <text x="180" y="228" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">theo từng danh mục</text>

  <path d="M292 60 V130" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M292 60 h8 M292 130 h8" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <text x="302" y="98" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Bước 1</text>

  <path d="M292 152 V178" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M292 152 h8 M292 178 h8" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <text x="302" y="168" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Bước 2</text>
</svg>
