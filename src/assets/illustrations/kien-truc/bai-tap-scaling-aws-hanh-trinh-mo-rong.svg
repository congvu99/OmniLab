<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-bsa-hanhtrinh-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-bsa-hanhtrinh-title">Hành trình mở rộng từ một máy tới Users+++++: mỗi bước xử lý đúng một nút thắt đã đo</title>
  <defs>
    <marker id="svg-bsa-hanhtrinh-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <path d="M25 100 H348" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-bsa-hanhtrinh-arrow)" />

  <circle cx="25" cy="100" r="5" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <circle cx="84" cy="100" r="7" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <circle cx="143" cy="100" r="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <circle cx="202" cy="100" r="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <circle cx="261" cy="100" r="11" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <circle cx="322" cy="100" r="13" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />

  <text x="25" y="80" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">1 máy</text>
  <text x="84" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Users+</text>
  <text x="143" y="80" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Users++</text>
  <text x="202" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Users+++</text>
  <text x="261" y="80" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Users++++</text>
  <text x="322" y="132" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Users+++++</text>

  <text x="180" y="180" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Mỗi bước: đo tải → xử lý đúng nút thắt đó → lặp lại</text>
</svg>
