<svg viewBox="0 0 360 300" width="100%" role="img" aria-labelledby="svg-social-graph-bidirectional-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-social-graph-bidirectional-title">So sánh vùng phải duyệt: BFS một chiều mở rộng tới tận đích, BFS hai chiều mỗi phía chỉ sâu một nửa rồi gặp nhau ở giữa</title>

  <text x="180" y="18" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--ink-2)">Một chiều: dò từ nguồn tới tận đích</text>
  <circle cx="150" cy="86" r="60" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="150" cy="86" r="6" fill="var(--accent)" />
  <circle cx="210" cy="86" r="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="150" y="106" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Nguồn</text>
  <text x="240" y="90" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Đích</text>
  <text x="290" y="136" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">≈ b^d node</text>

  <line x1="20" y1="160" x2="340" y2="160" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 4" />

  <text x="180" y="182" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--ink-2)">Hai chiều: mỗi phía sâu d/2, gặp nhau ở giữa</text>
  <circle cx="150" cy="240" r="30" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="210" cy="240" r="30" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="150" cy="240" r="6" fill="var(--accent)" />
  <circle cx="210" cy="240" r="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="290" y="282" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">≈ 2 × b^(d/2) node</text>
</svg>
