<svg viewBox="0 0 360 260" width="100%" role="img" aria-labelledby="svg-comm-rvr-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-comm-rvr-title">RPC gọi mỗi endpoint riêng cho từng việc, REST dùng một URI với nhiều động từ</title>
  <defs>
    <marker id="svg-comm-rvr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">RPC — mỗi việc một endpoint</text>

  <rect x="8" y="26" width="126" height="24" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="71" y="42" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">/signup</text>

  <rect x="8" y="56" width="126" height="24" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="71" y="72" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">/resign</text>

  <rect x="8" y="86" width="126" height="24" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="71" y="102" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">/readPerson</text>

  <rect x="270" y="46" width="82" height="42" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="311" y="71" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Server</text>

  <path d="M134 38 C 200 38, 200 60, 270 62" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-comm-rvr-arrow)" />
  <path d="M134 68 H270" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-comm-rvr-arrow)" />
  <path d="M134 98 C 200 98, 200 76, 270 74" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-comm-rvr-arrow)" />

  <line x1="0" y1="128" x2="360" y2="128" stroke="var(--line)" stroke-width="1" />

  <text x="8" y="154" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">REST — một URI, nhiều động từ</text>

  <rect x="8" y="196" width="150" height="28" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="83" y="215" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">/persons/1234</text>

  <rect x="270" y="196" width="82" height="28" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="311" y="215" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Server</text>

  <path d="M158 210 H270" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-comm-rvr-arrow)" />
  <text x="214" y="180" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">GET</text>
  <text x="214" y="194" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">PUT</text>
  <text x="214" y="240" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">DELETE</text>
</svg>
