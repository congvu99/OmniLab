<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-rp-hide-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-rp-hide-title">Proxy ngược gom nhiều client và giấu cấu trúc máy chủ nội bộ</title>
  <defs>
    <marker id="svg-rph-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
    <marker id="svg-rph-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <rect x="8" y="20" width="80" height="34" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="48" y="42" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Client A</text>

  <rect x="8" y="166" width="80" height="34" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="48" y="188" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Client B</text>

  <rect x="140" y="86" width="90" height="48" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="185" y="114" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Proxy ngược</text>

  <rect x="272" y="10" width="80" height="30" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="312" y="30" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Server 1</text>

  <rect x="272" y="95" width="80" height="30" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="312" y="115" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Server 2</text>

  <rect x="272" y="180" width="80" height="30" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="312" y="200" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Server 3</text>

  <path d="M88 37 C 115 37, 115 100, 140 105" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-rph-arrow-accent)" />
  <path d="M88 183 C 115 183, 115 120, 140 115" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-rph-arrow-accent)" />
  <text x="100" y="105" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">
    <tspan x="100" dy="0">1 địa chỉ</tspan>
    <tspan x="100" dy="13">duy nhất</tspan>
  </text>

  <path d="M230 100 C 250 100, 250 25, 272 25" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-rph-arrow-ink2)" />
  <path d="M230 110 H272" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-rph-arrow-ink2)" />
  <path d="M230 120 C 250 120, 250 195, 272 195" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-rph-arrow-ink2)" />
  <text x="255" y="150" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">
    <tspan x="255" dy="0">ẩn cấu trúc</tspan>
    <tspan x="255" dy="13">bên trong</tspan>
  </text>
</svg>
