<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-sec-tvth-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-sec-tvth-title">Truy vấn tham số hóa tách dữ liệu người dùng khỏi cấu trúc câu lệnh</title>
  <defs>
    <marker id="svg-sec-tvth-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Dữ liệu người dùng</text>
  <rect x="8" y="26" width="140" height="36" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="78" y="49" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">"user_id = 1234"</text>

  <path d="M148 44 H200" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-sec-tvth-arrow)" />

  <text x="208" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Câu lệnh cố định</text>
  <rect x="208" y="26" width="144" height="72" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="220" y="52" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">SELECT * FROM users</text>
  <text x="220" y="68" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">WHERE id =</text>
  <rect x="296" y="58" width="40" height="18" rx="4" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3" />
  <text x="316" y="71" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="10" fill="var(--accent)">?</text>
  <text x="220" y="88" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">— chỉ nhận giá trị, không nhận lệnh</text>

  <text x="180" y="130" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">dữ liệu luôn đi vào đúng "ô trống" dành cho giá trị,</text>
  <text x="180" y="146" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">không bao giờ được ghép vào phần cấu trúc câu lệnh</text>
</svg>
