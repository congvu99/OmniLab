<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-sec-tvth-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-sec-tvth-title">Truy vấn tham số hóa tách dữ liệu người dùng khỏi cấu trúc câu lệnh</title>
  <defs>
    <marker id="svg-sec-tvth-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Câu lệnh cố định (viết trước)</text>
  <rect x="8" y="26" width="344" height="46" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="20" y="54" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">SELECT * FROM users WHERE id =</text>
  <rect x="236" y="38" width="56" height="22" rx="6" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3" />
  <text x="264" y="54" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--accent)">?</text>

  <rect x="214" y="122" width="100" height="34" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="264" y="144" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">1234</text>
  <text x="202" y="144" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Dữ liệu người dùng</text>

  <path d="M264 122 V62" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-sec-tvth-arrow)" />

  <text x="180" y="186" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">dữ liệu được truyền riêng, chỉ lấp vào ô giá trị,</text>
  <text x="180" y="202" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">không bao giờ ghép vào cấu trúc câu lệnh</text>
</svg>
