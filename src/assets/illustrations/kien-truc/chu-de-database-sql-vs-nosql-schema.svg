  <line x1="208" y1="140" x2="266" y2="140" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  <text x="346" y="144" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">1 trường</text>
