  <rect x="196" y="26" width="156" height="34" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <line x1="208" y1="38" x2="282" y2="38" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  <line x1="208" y1="48" x2="270" y2="48" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  <text x="346" y="46" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">2 trường</text>

  <rect x="196" y="68" width="156" height="52" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <line x1="208" y1="80" x2="284" y2="80" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
