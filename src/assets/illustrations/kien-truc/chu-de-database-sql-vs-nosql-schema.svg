<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-db-svn-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-db-svn-title">Lược đồ cố định của SQL so với tài liệu linh hoạt của NoSQL</title>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">SQL — lược đồ cố định</text>

  <rect x="8" y="26" width="156" height="110" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <line x1="8" y1="62" x2="164" y2="62" stroke="var(--ink-2)" stroke-width="1" />
  <line x1="8" y1="98" x2="164" y2="98" stroke="var(--ink-2)" stroke-width="1" />
  <line x1="60" y1="26" x2="60" y2="136" stroke="var(--ink-2)" stroke-width="1" />
  <line x1="112" y1="26" x2="112" y2="136" stroke="var(--ink-2)" stroke-width="1" />
  <text x="34" y="46" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">id</text>
  <text x="86" y="46" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">tên</text>
  <text x="138" y="46" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">email</text>

