<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-cap-cp-ap-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-cap-cp-ap-title">Ví dụ chọn CP hay AP theo từng chức năng</title>

  <rect x="10" y="10" width="160" height="34" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="90" y="32" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Chọn CP khi...</text>

  <circle cx="20" cy="70" r="4" fill="var(--accent)" />
  <text x="32" y="75" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Chuyển khoản, trừ tiền</text>
  <circle cx="20" cy="100" r="4" fill="var(--accent)" />
  <text x="32" y="105" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Đặt vé số lượng có hạn</text>

  <rect x="190" y="10" width="160" height="34" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="270" y="32" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Chọn AP khi...</text>

  <circle cx="200" cy="70" r="4" fill="var(--ink-2)" />
  <text x="212" y="75" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Lượt thích, đếm view</text>
  <circle cx="200" cy="100" r="4" fill="var(--ink-2)" />
  <text x="212" y="105" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Giỏ hàng, feed mạng xã hội</text>

  <line x1="10" y1="140" x2="350" y2="140" stroke="var(--line)" stroke-width="1" />
  <text x="180" y="168" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Quyết định theo từng chức năng,</text>
  <text x="180" y="186" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">không phải toàn hệ thống</text>
</svg>
