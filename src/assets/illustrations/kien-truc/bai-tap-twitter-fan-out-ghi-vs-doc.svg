<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-btw-fanoutcmp-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-btw-fanoutcmp-title">So sánh chi phí: fan-out lúc ghi (push) và fan-out lúc đọc (pull)</title>
