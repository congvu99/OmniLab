  <circle cx="14" cy="144" r="4" fill="var(--ink-2)" />
  <path d="M18 144 H160" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-btw-fanoutcmp-arrow-ink2)" />
