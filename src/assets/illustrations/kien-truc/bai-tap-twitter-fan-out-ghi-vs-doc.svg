<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-btw-fanoutcmp-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-btw-fanoutcmp-title">So sánh chi phí: fan-out lúc ghi (push) nặng lúc đăng, fan-out lúc đọc (pull) nặng lúc đọc</title>

  <rect x="6" y="6" width="348" height="98" rx="12" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--line)" stroke-width="1" />
  <text x="18" y="26" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Fan-out on write (push)</text>
  <rect x="18" y="36" width="324" height="28" rx="8" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="30" y="55" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Đăng: ghi vào timeline của N follower · O(N)</text>
  <rect x="18" y="70" width="324" height="28" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="30" y="89" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Đọc: lấy danh sách có sẵn · O(1)</text>

  <rect x="6" y="114" width="348" height="98" rx="12" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1" />
  <text x="18" y="134" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Fan-out on read (pull)</text>
  <rect x="18" y="144" width="324" height="28" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="30" y="163" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Đăng: lưu 1 bản ghi · O(1)</text>
  <rect x="18" y="178" width="324" height="28" rx="8" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2" />
  <text x="30" y="197" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Đọc: gộp tweet của M người mình theo dõi · O(M)</text>
</svg>
