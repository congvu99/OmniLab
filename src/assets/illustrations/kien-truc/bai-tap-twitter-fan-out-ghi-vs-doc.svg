  <path d="M18 84 H160" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-btw-fanoutcmp-arrow-ink2)" />
  <rect x="160" y="70" width="180" height="28" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="250" y="88" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Hiển thị ngay</text>

