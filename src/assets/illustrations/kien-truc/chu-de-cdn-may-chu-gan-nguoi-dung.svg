<svg viewBox="0 0 360 300" width="100%" role="img" aria-labelledby="svg-cdn-proximity-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-cdn-proximity-title">Không có CDN so với có CDN: khoảng cách tới người dùng</title>
  <defs>
    <marker id="svg-cdnp-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
    <marker id="svg-cdnp-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="8" y="20" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Không có CDN</text>
  <circle cx="40" cy="75" r="16" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="40" y="79" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">User</text>
  <rect x="250" y="55" width="100" height="40" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="300" y="79" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Server gốc</text>
  <path d="M58 75 H250" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#svg-cdnp-arrow-ink2)" />
  <text x="150" y="68" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">xa → chậm</text>

  <line x1="0" y1="130" x2="360" y2="130" stroke="var(--line)" stroke-width="1" />

  <text x="8" y="156" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Có CDN</text>
  <circle cx="40" cy="220" r="16" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="40" y="224" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">User</text>
  <rect x="140" y="200" width="90" height="40" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="185" y="224" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Điểm CDN gần</text>
  <rect x="262" y="205" width="90" height="30" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="307" y="225" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink)">Server gốc</text>

  <path class="svg-cdnp-flow" d="M58 220 H140" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-cdnp-arrow-accent)" />
  <text x="99" y="213" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--accent)">gần → nhanh</text>
  <path d="M230 220 H262" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#svg-cdnp-arrow-ink2)" />
  <text x="246" y="258" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">đồng bộ khi cần</text>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .svg-cdnp-flow { stroke-dasharray: 6 6; animation: svg-cdnp-dash 1.6s linear infinite; }
    }
    @keyframes svg-cdnp-dash { to { stroke-dashoffset: -20; } }
  </style>
</svg>
