<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-latency-throughput-gom-lo-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-latency-throughput-gom-lo-title">Gửi ngay từng item so với gom lô rồi gửi một lần</title>
  <defs>
    <marker id="svg-ltb-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="8" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Gửi ngay từng cái (3 lượt)</text>
  <rect x="10" y="26" width="70" height="54" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="45" y="57" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">App</text>
  <rect x="280" y="26" width="70" height="54" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="315" y="57" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">DB</text>
  <path d="M80 36 H278" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ltb-arrow-accent)" />
  <path d="M80 53 H278" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ltb-arrow-accent)" />
  <path d="M80 70 H278" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ltb-arrow-accent)" />
  <rect x="174" y="30" width="12" height="12" rx="3" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="174" y="47" width="12" height="12" rx="3" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="174" y="64" width="12" height="12" rx="3" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="180" y="98" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Mỗi item tới sớm, nhưng thông lượng thấp hơn</text>

  <line x1="0" y1="112" x2="360" y2="112" stroke="var(--line)" stroke-width="1" />

  <text x="8" y="134" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink-2)">Gom lô rồi gửi 1 lần</text>
  <rect x="10" y="144" width="70" height="44" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="45" y="170" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">App</text>
  <rect x="280" y="144" width="70" height="44" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="315" y="170" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">DB</text>
  <path d="M80 166 H278" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ltb-arrow-accent)" />
  <rect x="150" y="155" width="60" height="22" rx="6" fill="var(--surface-2)" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3" />
  <rect x="157" y="160" width="12" height="12" rx="3" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="174" y="160" width="12" height="12" rx="3" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="191" y="160" width="12" height="12" rx="3" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="180" y="208" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Item đầu chờ lâu hơn, nhưng thông lượng tăng</text>
</svg>
