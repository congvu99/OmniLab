<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-tuan06-rut-mot-lan-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-tuan06-rut-mot-lan-title">So sánh rút bảo hiểm xã hội một lần với nhận lương hưu hằng tháng</title>

  <line x1="30" y1="20" x2="30" y2="190" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="190" x2="340" y2="190" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />

  <line x1="30" y1="120" x2="330" y2="120" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" />
  <text x="335" y="116" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">rút một lần</text>

  <path d="M30 175 C 150 165, 250 110, 330 45" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" />
  <text x="335" y="40" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--accent)">lương hưu hằng tháng</text>

  <text x="30" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">nghỉ hưu</text>
  <text x="330" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">15 năm sau</text>

  <text x="12" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">tổng nhận</text>
</svg>
