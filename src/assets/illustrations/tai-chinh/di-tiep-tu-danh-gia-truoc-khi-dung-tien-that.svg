<svg viewBox="0 0 360 300" width="100%" role="img" aria-labelledby="svg-truoc-khi-dung-tien-that-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-truoc-khi-dung-tien-that-title">Năm điều cần hiểu rõ trước khi quyết định dùng tiền thật</title>
  <defs>
    <marker id="svg-tkdtt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <rect x="8" y="10" width="16" height="16" rx="4" fill="none" stroke="var(--accent)" stroke-width="2" />
  <text x="34" y="23" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Mục tiêu</text>

  <rect x="8" y="42" width="16" height="16" rx="4" fill="none" stroke="var(--accent)" stroke-width="2" />
  <text x="34" y="55" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Thời điểm cần tiền</text>

  <rect x="8" y="74" width="16" height="16" rx="4" fill="none" stroke="var(--accent)" stroke-width="2" />
  <text x="34" y="87" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Khả năng chịu lỗ</text>

  <rect x="8" y="106" width="16" height="16" rx="4" fill="none" stroke="var(--accent)" stroke-width="2" />
  <text x="34" y="119" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Chi phí</text>

  <rect x="8" y="138" width="16" height="16" rx="4" fill="none" stroke="var(--accent)" stroke-width="2" />
  <text x="34" y="151" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Tính hợp pháp của kênh giao dịch</text>

  <path d="M180 164 V182" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-tkdtt-arrow)" />

  <rect x="70" y="184" width="220" height="44" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="180" y="211" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--accent)">Quyết định dùng tiền thật</text>
</svg>
