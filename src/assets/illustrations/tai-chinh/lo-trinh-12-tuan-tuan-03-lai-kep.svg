<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-lai-kep-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-lai-kep-title">Lãi kép tăng nhanh dần theo thời gian, lãi đơn tăng đều</title>

  <line x1="30" y1="20" x2="30" y2="190" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="190" x2="340" y2="190" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />

  <path d="M30 180 L330 120" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M30 180 C 150 175, 250 140, 330 40" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" />

  <text x="335" y="112" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)" text-anchor="end">lãi đơn</text>
  <text x="335" y="35" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--accent)" text-anchor="end" font-weight="700">lãi kép</text>

  <text x="30" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">0</text>
  <text x="185" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">10 năm</text>
  <text x="335" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">20 năm</text>

  <text x="12" y="16" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">số tiền</text>
</svg>
