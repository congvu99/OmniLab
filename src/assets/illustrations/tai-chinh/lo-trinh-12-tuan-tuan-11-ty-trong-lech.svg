  <text x="260" y="107" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">85%</text>
  <rect x="220" y="167" width="80" height="23" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="260" y="184" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">15%</text>
  <text x="260" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Sau 1 năm</text>
