<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-tuan09-thoi-han-cho-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-tuan09-thoi-han-cho-title">Thời hạn cần tiền càng xa, càng có thời gian chờ phục hồi nếu giá giảm</title>

  <line x1="20" y1="170" x2="340" y2="170" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />

  <rect x="55" y="140" width="40" height="30" rx="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="75" y="132" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">cần ổn định</text>
  <text x="75" y="188" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">1 năm</text>

  <rect x="170" y="100" width="40" height="70" rx="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="190" y="92" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">chờ được vừa phải</text>
  <text x="190" y="188" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">5 năm</text>

  <rect x="285" y="50" width="40" height="120" rx="6" fill="color-mix(in srgb, var(--accent) 14%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="350" y="42" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" font-weight="700" fill="var(--accent)">chờ được lâu hơn</text>
  <text x="305" y="188" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">25 năm</text>
</svg>
