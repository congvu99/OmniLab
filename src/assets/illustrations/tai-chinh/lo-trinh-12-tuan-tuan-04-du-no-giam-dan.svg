<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-du-no-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-du-no-title">Lãi tính trên dư nợ giảm dần theo từng kỳ trả góp</title>

  <text x="180" y="16" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Cột = dư nợ đầu kỳ; lãi 1%/tháng (số giả định)</text>

  <line x1="20" y1="190" x2="330" y2="190" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />

  <!-- 15px = 1 triệu dư nợ: kỳ 1 = 10tr, kỳ 4 = 7tr, kỳ 7 = 4tr, kỳ 10 = 1tr -->
  <rect x="30" y="40" width="50" height="150" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="110" y="85" width="50" height="105" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="190" y="130" width="50" height="60" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="270" y="175" width="50" height="15" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />

  <text x="55" y="33" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">lãi 100 nghìn</text>
  <text x="135" y="78" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">lãi 70 nghìn</text>
  <text x="215" y="123" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">lãi 40 nghìn</text>
  <text x="295" y="168" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--accent)">lãi 10 nghìn</text>

  <text x="55" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Kỳ 1 · 10tr</text>
  <text x="135" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Kỳ 4 · 7tr</text>
  <text x="215" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Kỳ 7 · 4tr</text>
  <text x="295" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">Kỳ 10 · 1tr</text>
</svg>
