<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-chon-nhanh-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-chon-nhanh-title">Chọn một trong ba nhánh để đi tiếp sau 12 tuần: đời sống, kinh doanh hoặc nghề nghiệp</title>
  <defs>
    <marker id="svg-cn-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <rect x="110" y="10" width="140" height="40" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="34" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Sau 12 tuần</text>

  <path d="M150 50 V64 H60 V80" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#svg-cn-arrow)" />
  <path d="M180 50 V80" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-cn-arrow)" />
  <path d="M210 50 V64 H300 V80" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#svg-cn-arrow)" />

  <rect x="10" y="82" width="100" height="120" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="60" y="106" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">A · Đời sống</text>
  <text x="60" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">
    <tspan x="60" dy="0">quản lý tiền</tspan>
    <tspan x="60" dy="16">cá nhân</tspan>
  </text>

  <rect x="130" y="82" width="100" height="120" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="180" y="106" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--accent)">B · Kinh doanh</text>
  <text x="180" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">
    <tspan x="180" dy="0">đọc báo cáo</tspan>
    <tspan x="180" dy="16">tài chính</tspan>
  </text>

  <rect x="250" y="82" width="100" height="120" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="300" y="106" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">C · Nghề nghiệp</text>
  <text x="300" y="128" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">
    <tspan x="300" dy="0">chọn việc rồi</tspan>
    <tspan x="300" dy="16">mới chọn chứng chỉ</tspan>
  </text>
</svg>
