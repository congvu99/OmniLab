<svg viewBox="0 0 360 240" width="100%" role="img" aria-labelledby="svg-tuan12-vong-lap-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-tuan12-vong-lap-title">Vòng lặp rà soát và điều chỉnh kế hoạch tài chính sau mỗi 30 ngày</title>

  <rect x="6" y="90" width="104" height="60" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="58" y="114" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Ghi nguyên tắc</text>
  <text x="58" y="130" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">&amp; thực hành</text>

  <line x1="114" y1="120" x2="126" y2="120" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M122 115 L130 120 L122 125 Z" fill="var(--ink-2)" />

  <rect x="130" y="90" width="104" height="60" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="182" y="114" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">Rà soát sau</text>
  <text x="182" y="130" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink)">30 ngày</text>

  <line x1="238" y1="120" x2="250" y2="120" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M246 115 L254 120 L246 125 Z" fill="var(--ink-2)" />

  <rect x="254" y="90" width="104" height="60" rx="10" fill="color-mix(in srgb, var(--accent) 14%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="306" y="114" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--ink)">Điều chỉnh</text>
  <text x="306" y="130" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" font-weight="700" fill="var(--ink)">&amp; tiếp tục</text>

  <path d="M306 150 C 306 210, 58 210, 58 150" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <path d="M52 154 L58 150 L64 154" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="182" y="200" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">lặp lại mỗi tháng</text>
</svg>
