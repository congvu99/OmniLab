<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-lich-doc-12-tuan-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-lich-doc-12-tuan-title">Lịch đọc gắn với 12 tuần: S1 xuyên suốt, S2 ở tuần 9-10, ôn tập tuần 11-12, sách mở rộng sau đó</title>

  <line x1="15" y1="110" x2="345" y2="110" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />
  <rect x="30" y="104" width="200" height="12" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" />
  <line x1="230" y1="110" x2="330" y2="110" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" />

  <circle cx="30" cy="110" r="6" fill="var(--accent)" />
  <text x="30" y="88" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Tuần 1-8</text>
  <text x="30" y="140" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">S1 theo chương</text>

  <circle cx="130" cy="110" r="6" fill="var(--accent)" />
  <text x="130" y="88" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Tuần 9-10</text>
  <text x="130" y="140" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">S2</text>

  <circle cx="230" cy="110" r="6" fill="var(--accent)" />
  <text x="230" y="88" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">Tuần 11-12</text>
  <text x="230" y="140" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">Ôn tập</text>

  <circle cx="330" cy="110" r="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="330" y="88" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)">
    <tspan x="330" dy="0">Sau</tspan>
    <tspan x="330" dy="14">12 tuần</tspan>
  </text>
  <text x="330" y="150" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">S3, S4, S5</text>
</svg>
