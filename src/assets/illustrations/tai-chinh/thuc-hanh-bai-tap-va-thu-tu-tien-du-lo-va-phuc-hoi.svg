<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-lo-va-phuc-hoi-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-lo-va-phuc-hoi-title">Lỗ và phục hồi không đối xứng: giảm càng nhiều thì cần tăng tỉ lệ lớn hơn để về lại mức ban đầu</title>

  <line x1="20" y1="190" x2="340" y2="190" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />

  <rect x="55" y="160" width="30" height="30" rx="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="70" y="154" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">−20%</text>

  <rect x="95" y="152" width="30" height="38" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="110" y="146" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" font-weight="700" fill="var(--accent)">+25%</text>

  <text x="90" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">giảm 20%</text>

  <rect x="215" y="130" width="30" height="60" rx="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="230" y="124" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">−40%</text>

  <rect x="255" y="90" width="30" height="100" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="270" y="84" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" font-weight="700" fill="var(--accent)">+66,7%</text>

  <text x="250" y="206" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">giảm 40%</text>
</svg>
