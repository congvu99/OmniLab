<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-quy-du-phong-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-quy-du-phong-title">Quỹ dự phòng: mốc thử 3–6 tháng chi thiết yếu, hiện có bao nhiêu</title>

  <rect x="140" y="20" width="80" height="180" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="142" y="142" width="76" height="56" rx="8" fill="color-mix(in srgb, var(--accent) 12%, transparent)" />
  <line x1="140" y1="142" x2="220" y2="142" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />

  <line x1="130" y1="110" x2="230" y2="110" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" />
  <text x="235" y="114" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">mốc 3 tháng</text>

  <text x="180" y="14" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12" fill="var(--ink-2)">mốc 6 tháng</text>

  <text x="90" y="170" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--accent)">hiện có:</text>
  <text x="90" y="188" text-anchor="end" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--accent)">~2 tháng</text>

  <text x="180" y="214" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="var(--ink-2)">tính theo chi thiết yếu / tháng</text>
</svg>
