<svg viewBox="0 0 360 300" width="100%" role="img" aria-labelledby="svg-dtq-lich-cong-bo-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-dtq-lich-cong-bo-title">Hạn công bố báo cáo định kỳ của quỹ đại chúng theo Thông tư 96/2020/TT-BTC Điều 26: báo cáo tháng trong 5 ngày làm việc, báo cáo quý 20 ngày, báo cáo bán niên 45 ngày, báo cáo tổng kết năm 90 ngày, tính từ ngày kết thúc kỳ báo cáo</title>

  <defs>
    <marker id="svg-dtq-lich-cong-bo-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <g fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2">
    <rect x="10" y="20" width="170" height="44" rx="8" />
    <rect x="10" y="82" width="170" height="44" rx="8" />
    <rect x="10" y="144" width="170" height="44" rx="8" />
    <rect x="10" y="206" width="170" height="44" rx="8" />
  </g>
  <g fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2">
    <rect x="208" y="20" width="142" height="44" rx="8" />
    <rect x="208" y="82" width="142" height="44" rx="8" />
    <rect x="208" y="144" width="142" height="44" rx="8" />
    <rect x="208" y="206" width="142" height="44" rx="8" />
  </g>
  <g stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#svg-dtq-lich-cong-bo-arrow)">
    <line x1="184" y1="42" x2="204" y2="42" />
    <line x1="184" y1="104" x2="204" y2="104" />
    <line x1="184" y1="166" x2="204" y2="166" />
    <line x1="184" y1="228" x2="204" y2="228" />
  </g>

  <g font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13">
    <g fill="var(--ink)">
      <text x="95" y="46" text-anchor="middle">Báo cáo tháng</text>
      <text x="95" y="108" text-anchor="middle">Báo cáo quý</text>
      <text x="95" y="170" text-anchor="middle">Báo cáo bán niên</text>
      <text x="95" y="232" text-anchor="middle">Báo cáo tổng kết năm</text>
    </g>
    <g fill="var(--ink)" font-weight="700" text-anchor="middle">
      <text x="279" y="46">5 ngày làm việc</text>
      <text x="279" y="108">20 ngày</text>
      <text x="279" y="170">45 ngày</text>
      <text x="279" y="232">90 ngày</text>
    </g>
    <text x="180" y="280" text-anchor="middle" font-style="italic" fill="var(--ink-2)">Tính từ ngày kết thúc kỳ báo cáo</text>
  </g>
</svg>
