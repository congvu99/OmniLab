<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-dtq-qlg-cach-tinh-nav-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-dtq-qlg-cach-tinh-nav-title">Cách tính NAV của quỹ giả định: tổng tài sản 102 tỷ trừ nợ 2 tỷ bằng NAV 100 tỷ; chia cho 10 triệu chứng chỉ quỹ được 10.000 đồng một chứng chỉ</title>

  <rect x="12" y="30" width="100" height="62" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="136" y="30" width="76" height="62" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="236" y="30" width="112" height="62" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <rect x="200" y="142" width="148" height="52" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />

  <line x1="292" y1="94" x2="292" y2="140" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  <polyline points="286,132 292,140 298,132" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <g font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">
    <g text-anchor="middle">
      <text x="62" y="56">Tổng tài sản</text>
      <text x="62" y="76" font-weight="700">102 tỷ</text>
      <text x="174" y="66" font-weight="700">Nợ 2 tỷ</text>
      <text x="292" y="66" font-weight="700" fill="var(--accent)">NAV 100 tỷ</text>
      <text x="274" y="173" font-weight="700" fill="var(--accent)">10.000 đồng / CCQ</text>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink-2)">
      <text x="124" y="67">−</text>
      <text x="224" y="67">=</text>
    </g>
    <text x="284" y="122" text-anchor="end" fill="var(--ink-2)">chia 10 triệu CCQ</text>
    <text x="12" y="165" fill="var(--ink-2)">Minh góp 10 triệu</text>
    <text x="12" y="183" fill="var(--ink-2)">= 1.000 CCQ</text>
  </g>
</svg>
