<svg viewBox="0 0 360 300" width="100%" role="img" aria-labelledby="svg-tchv-nhat-ky-quyet-dinh-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-tchv-nhat-ky-quyet-dinh-title">Dòng thời gian nhật ký quyết định: trước khi quyết định ghi lý do, kỳ vọng, độ tự tin, cảm xúc; có kết quả; ba tháng sau đọc lại; rồi sửa quy trình. Phải ghi trước khi biết kết quả</title>
  <defs>
    <marker id="svg-nkqd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <path d="M30 64 V112" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-nkqd-arrow)" />
  <path d="M30 134 V172" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-nkqd-arrow)" />
  <path d="M30 194 V234" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-nkqd-arrow)" />

  <circle cx="30" cy="54" r="7" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="50" y="20" width="302" height="68" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="64" y="44" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" fill="var(--ink)">Lý do, kỳ vọng, độ tự tin, cảm xúc</text>
  <rect x="64" y="56" width="204" height="24" rx="6" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2" />
  <text x="166" y="73" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Ghi trước khi biết kết quả</text>

  <circle cx="30" cy="124" r="7" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="50" y="104" width="302" height="40" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="64" y="129" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" fill="var(--ink)">Có kết quả</text>

  <circle cx="30" cy="184" r="7" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <rect x="50" y="164" width="302" height="40" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="64" y="189" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" fill="var(--ink)">3 tháng sau: đọc lại</text>

  <circle cx="30" cy="246" r="7" fill="var(--accent)" />
  <rect x="50" y="224" width="302" height="44" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="64" y="251" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Sửa quy trình</text>
</svg>
