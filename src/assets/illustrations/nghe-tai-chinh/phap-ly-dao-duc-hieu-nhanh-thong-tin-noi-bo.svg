<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-pldd-thong-tin-noi-bo-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-pldd-thong-tin-noi-bo-title">Luồng thông tin nội bộ: người nội bộ tiết lộ cho người nhận tin, người nhận tin mua bán chứng khoán; cả hai bước đều bị cấm theo khoản 2 Điều 12 Luật Chứng khoán</title>
  <defs>
    <marker id="svg-ttnb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--danger)" />
    </marker>
  </defs>

  <path d="M66 86 C 82 44, 150 44, 166 82" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ttnb-arrow)" />
  <text x="116" y="40" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--danger)">tiết lộ</text>

  <path d="M194 86 C 210 44, 278 44, 294 82" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ttnb-arrow)" />
  <text x="244" y="40" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--danger)">mua bán</text>

  <rect x="8" y="88" width="88" height="60" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="52" y="114" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">
    <tspan x="52" dy="0">Người</tspan>
    <tspan x="52" dy="17">nội bộ</tspan>
  </text>

  <rect x="136" y="88" width="88" height="60" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="114" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">
    <tspan x="180" dy="0">Người</tspan>
    <tspan x="180" dy="17">nhận tin</tspan>
  </text>

  <rect x="264" y="88" width="88" height="60" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="308" y="123" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Giao dịch</text>

  <path d="M52 156 V166 H308 V156" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="180" y="190" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--danger)">Cả hai bước đều vi phạm</text>
  <text x="180" y="208" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink-2)">khoản 2 Điều 12 Luật Chứng khoán</text>
</svg>
