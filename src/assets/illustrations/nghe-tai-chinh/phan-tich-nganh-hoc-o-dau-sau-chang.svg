<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-ptn-sau-chang-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-ptn-sau-chang-title">Sáu chặng nghiên cứu một ngành theo thứ tự: ranh giới, năm lực, chỉ số, chuỗi giá trị, chu kỳ và quy định, rồi so sánh các doanh nghiệp</title>
  <defs>
    <marker id="svg-ptsc-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
  </defs>

  <!-- row 1 -->
  <rect x="12" y="16" width="100" height="72" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="62" y="42" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)"><tspan x="62" dy="0" font-size="15" font-weight="700" fill="var(--accent)">1</tspan><tspan x="62" dy="24">Ranh giới</tspan></text>
  <line x1="115" y1="52" x2="125" y2="52" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ptsc-arrow-ink2)" />

  <rect x="130" y="16" width="100" height="72" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="42" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)"><tspan x="180" dy="0" font-size="15" font-weight="700" fill="var(--accent)">2</tspan><tspan x="180" dy="24">Năm lực</tspan></text>
  <line x1="233" y1="52" x2="243" y2="52" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ptsc-arrow-ink2)" />

  <rect x="248" y="16" width="100" height="72" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="298" y="42" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)"><tspan x="298" dy="0" font-size="15" font-weight="700" fill="var(--accent)">3</tspan><tspan x="298" dy="24">Chỉ số</tspan></text>

  <!-- wrap from stage 3 to stage 4 -->
  <path d="M298 92V100Q298 108 290 108H70Q62 108 62 116V122" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#svg-ptsc-arrow-ink2)" />

  <!-- row 2 -->
  <rect x="12" y="128" width="100" height="76" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="62" y="152" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)"><tspan x="62" dy="0" font-size="15" font-weight="700" fill="var(--accent)">4</tspan><tspan x="62" dy="21">Chuỗi</tspan><tspan x="62" dy="17">giá trị</tspan></text>
  <line x1="115" y1="166" x2="125" y2="166" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ptsc-arrow-ink2)" />

  <rect x="130" y="128" width="100" height="76" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="152" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)"><tspan x="180" dy="0" font-size="15" font-weight="700" fill="var(--accent)">5</tspan><tspan x="180" dy="21">Chu kỳ,</tspan><tspan x="180" dy="17">quy định</tspan></text>
  <line x1="233" y1="166" x2="243" y2="166" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-ptsc-arrow-ink2)" />

  <!-- stage 6: the goal -->
  <rect x="248" y="128" width="100" height="76" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="298" y="152" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--ink)"><tspan x="298" dy="0" font-size="15" fill="var(--accent)">6</tspan><tspan x="298" dy="24">So sánh</tspan></text>
</svg>
