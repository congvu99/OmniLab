<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-ntc-ho-so-chu-t-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-ntc-ho-so-chu-t-title">Hồ sơ chữ T: thanh ngang là năm kỹ năng bổ trợ (dữ liệu, vĩ mô, pháp lý, hành vi, giao tiếp), thanh dọc là chuyên môn sâu về một ngành</title>

  <text x="180" y="20" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink-2)">Thanh ngang: năm nhóm kỹ năng bổ trợ</text>

  <rect x="10" y="30" width="340" height="44" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <g stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round">
    <line x1="78" y1="36" x2="78" y2="68" />
    <line x1="146" y1="36" x2="146" y2="68" />
    <line x1="214" y1="36" x2="214" y2="68" />
    <line x1="282" y1="36" x2="282" y2="68" />
  </g>
  <g font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)" text-anchor="middle">
    <text x="44" y="57">Dữ liệu</text>
    <text x="112" y="57">Vĩ mô</text>
    <text x="180" y="57">Pháp lý</text>
    <text x="248" y="57">Hành vi</text>
    <text x="316" y="57">Giao tiếp</text>
  </g>

  <rect x="120" y="80" width="120" height="130" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" />
  <text x="180" y="140" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" font-weight="700" fill="var(--accent)">
    <tspan x="180" dy="0">Chuyên môn sâu</tspan>
    <tspan x="180" dy="20" font-weight="400" fill="var(--ink-2)">Một ngành</tspan>
  </text>
</svg>
