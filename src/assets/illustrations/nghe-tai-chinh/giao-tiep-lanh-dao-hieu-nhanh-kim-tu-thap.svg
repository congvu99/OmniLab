<svg viewBox="0 0 360 220" width="100%" role="img" aria-labelledby="svg-gtl-kim-tu-thap-title" xmlns="http://www.w3.org/2000/svg">
  <title id="svg-gtl-kim-tu-thap-title">Kim tự tháp Minto: kết luận đặt trên cùng, ba lý do ở giữa, dữ liệu chứng minh ở đáy; người đọc bận chỉ cần đọc đỉnh</title>
  <defs>
    <marker id="svg-gtkt-arrow-ink2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--ink-2)" />
    </marker>
    <marker id="svg-gtkt-arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--accent)" />
    </marker>
  </defs>

  <!-- connectors: conclusion -> reasons -> evidence -->
  <path d="M112 56L44 82M112 56V82M112 56L180 82" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M44 122V146M112 122V146M180 122V146" fill="none" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round" />

  <!-- top: conclusion -->
  <rect x="67" y="16" width="90" height="40" rx="10" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="var(--accent)" stroke-width="2.5" />
  <text x="112" y="41" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Kết luận</text>

  <!-- middle: reasons -->
  <rect x="12" y="82" width="64" height="40" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="44" y="107" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Lý do 1</text>
  <rect x="80" y="82" width="64" height="40" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="112" y="107" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Lý do 2</text>
  <rect x="148" y="82" width="64" height="40" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="180" y="107" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Lý do 3</text>

  <!-- base: evidence -->
  <rect x="12" y="146" width="200" height="40" rx="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="2" />
  <text x="112" y="171" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)">Dữ liệu chứng minh</text>

  <!-- busy reader stops at the top -->
  <line x1="232" y1="36" x2="164" y2="36" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#svg-gtkt-arrow-accent)" />
  <text x="238" y="31" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink)"><tspan x="238" dy="0">Người đọc bận</tspan><tspan x="238" dy="17">dừng ở đây</tspan></text>

  <!-- detail grows downward, read only if needed -->
  <line x1="228" y1="88" x2="228" y2="180" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#svg-gtkt-arrow-ink2)" />
  <text x="240" y="128" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13" fill="var(--ink-2)"><tspan x="240" dy="0">Ai cần mới</tspan><tspan x="240" dy="17">đọc tiếp</tspan></text>
</svg>
